<div class="shell">
  <main class="shell-content">
    <header class="shell-content__header">
      <div class="shell-content__header-left">
        <div class="brand-bar">
          <a
            href="https://identityexe.com"
            target="_blank"
            rel="noopener noreferrer"
            class="brand-identity-group"
            title="Visit IdentityEXE (identityexe.com)"
          >
            <img [src]="logoPath()" alt="IdentityEXE Logo" class="brand-logo" />
            <span class="brand-creator">By Tyler Rettkowski</span>
          </a>
          <div class="brand-divider"></div>
          <div class="brand-text">
            <h1 class="spds-h4">{{ title() }}</h1>
          </div>
        </div>
      </div>
      <div class="shell-content__meta">
        <button
          type="button"
          class="theme-toggle-btn"
          (click)="themeService.toggleTheme()"
          [pTooltip]="themeService.theme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
          tooltipPosition="bottom"
        >
          <i class="pi" [class.pi-sun]="themeService.theme() === 'dark'" [class.pi-moon]="themeService.theme() === 'light'"></i>
          <span class="theme-text">{{ themeService.theme() === 'dark' ? 'Light Mode' : 'Dark Mode' }}</span>
        </button>
        @if (context(); as ctx) {
          <span class="shell-content__context">
            <strong>{{ ctx.tenant.org }}</strong> &middot; {{ ctx.user.displayName }}
          </span>
        } @else {
          <span class="shell-content__context dev-badge">
            <strong>devrel-ga-25045</strong> &middot; Admin
          </span>
        }
      </div>
    </header>

    <div class="shell-content__card">
      <router-outlet />
    </div>
  </main>
</div>
